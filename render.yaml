# Render 무료 웹 서비스 (Blueprint)
# 키 값은 이 파일에 넣지 않는다. 처음 만들 때 Render 화면에서 직접 입력한다.
services:
  - type: web
    name: document-assistant
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/documents/status
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: OPENAI_API_KEY
        sync: false
      - key: LAW_OPEN_API_OC
        sync: false
      # 공개 시험 서버라 사진 분석 횟수를 제한한다. 필요하면 Render 화면에서 바꾼다.
      - key: ANALYSIS_DAILY_LIMIT
        value: "100"
      - key: ANALYSIS_HOURLY_LIMIT_PER_IP
        value: "10"
